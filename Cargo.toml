[package]
name = "gemini-proxy"
version = "0.1.0"
edition = "2024"
authors = ["vitaly"]
description = "Perfect Gemini-to-OpenAI compatible API proxy"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Gemini SDK
gemini-sdk = { path = "../gemini-sdk", features = ["browser-attestation"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = "0.2"
futures = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
url = "2"
urlencoding = "2"
http = "1"

[features]
default = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
